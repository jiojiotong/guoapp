name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          pod --version
          go version
      - name: Build unsigned IPA (${{ matrix.edition }})
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - name: List output
        run: ls -la dist/ios/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
