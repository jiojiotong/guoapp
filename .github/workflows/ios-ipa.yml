name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-ipa.yml'

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-14
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          flutter --version
          pod --version
          go version
      # 上游仓库的 pubspec.lock 落后于 pubspec.yaml（video_player 等未写入锁文件），
      # 而 scripts/build_ios.py 内部使用 `flutter pub get --enforce-lockfile` 会因此直接失败。
      # 这里先在构建工作区把锁文件刷新到与 pubspec.yaml 一致，脚本内的 --enforce-lockfile 即可通过。
      - name: 同步 pubspec.lock
        run: |
          set -euo pipefail
          flutter pub get
          echo "--- 校验：再次以 --enforce-lockfile 方式解析 ---"
          flutter pub get --enforce-lockfile
      - name: Build unsigned IPA (${{ matrix.edition }})
        run: python3 scripts/build_ios.py ${{ matrix.arguments }}
      - name: List output
        run: ls -la dist/ios/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
